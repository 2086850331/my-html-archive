<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML 归档导航</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
        background: #f5f6f8;
        color: #333;
        padding: 40px 24px;
        line-height: 1.6;
    }
    .container {
        max-width: 900px;
        margin: 0 auto;
    }
    h1 {
        font-size: 26px;
        color: #2f5f77;
        margin-bottom: 8px;
        padding-left: 14px;
        border-left: 5px solid #457e98;
    }
    .subtitle {
        font-size: 14px;
        color: #888;
        margin-bottom: 28px;
        padding-left: 19px;
    }
    .card {
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        overflow: hidden;
    }
    .item {
        display: flex;
        align-items: center;
        padding: 16px 24px;
        border-bottom: 1px solid #eef0f3;
        text-decoration: none;
        color: #333;
        transition: background 0.15s;
    }
    .item:last-child { border-bottom: none; }
    .item:hover { background: #f0f7fa; }
    .icon {
        width: 40px;
        height: 40px;
        border-radius: 8px;
        background: #eaf2f8;
        color: #457e98;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        margin-right: 16px;
        flex-shrink: 0;
    }
    .info { flex: 1; min-width: 0; }
    .name {
        font-size: 16px;
        font-weight: 600;
        color: #2f5f77;
        margin-bottom: 2px;
    }
    .desc {
        font-size: 13px;
        color: #888;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .arrow {
        color: #bbb;
        font-size: 18px;
        margin-left: 12px;
    }
    footer {
        text-align: center;
        font-size: 12px;
        color: #aaa;
        margin-top: 32px;
    }
</style>
</head>
<body>
<div class="container">
    <h1>HTML 归档导航</h1>
    <p class="subtitle">点击下方条目访问对应页面</p>

    <div class="card">
        <a class="item" href="./TB_ReaderRecords-防撞.html">
            <div class="icon">📊</div>
            <div class="info">
                <div class="name">TB_ReaderRecords - 防撞</div>
                <div class="desc">TB_ReaderRecords 相关查询与说明</div>
            </div>
            <div class="arrow">›</div>
        </a>

        <a class="item" href="./ffmpeg_guide.html">
            <div class="icon">🎬</div>
            <div class="info">
                <div class="name">FFmpeg 使用指南</div>
                <div class="desc">FFmpeg 安装、推流、常用命令说明</div>
            </div>
            <div class="arrow">›</div>
        </a>

        <a class="item" href="./language.html">
            <div class="icon">🌐</div>
            <div class="info">
                <div class="name">语言文件对比</div>
                <div class="desc">zh-HK.js / en-US.js 缺失编号对比</div>
            </div>
            <div class="arrow">›</div>
        </a>
    </div>

    <footer>
        HTML 归档 · 持续更新
    </footer>
</div>
</body>
</html>
